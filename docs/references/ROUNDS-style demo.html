<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<title>ROUNDS-style demo</title>
<style>
:root{--bg:#f3f1ec;--fg:#23232b;--mut:#6b6b76;--chip:#e2dfd6;--on:#23232b;--onfg:#f3f1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14141a;--fg:#e8e6df;--mut:#9a9aa6;--chip:#25252e;--on:#e8e6df;--onfg:#14141a}}
:root[data-theme="dark"]{--bg:#14141a;--fg:#e8e6df;--mut:#9a9aa6;--chip:#25252e;--on:#e8e6df;--onfg:#14141a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;box-sizing:border-box}
canvas{display:block;width:min(100%,1280px,calc((100vh - 130px)*1.7778));aspect-ratio:16/9;border-radius:12px;cursor:crosshair;touch-action:none;background:#1c1b2e}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{font:inherit;color:var(--fg);background:var(--chip);border:0;border-radius:999px;padding:6px 14px;cursor:pointer}
button.on{background:var(--on);color:var(--onfg)}
.hint{margin:0;color:var(--mut);text-align:center;font-size:13px}
#ov{position:fixed;inset:0;z-index:10;display:flex;padding:16px;background:rgba(6,12,20,.78);backdrop-filter:blur(6px);overflow:auto}
#ov[hidden]{display:none}
.ovbox{display:flex;flex-direction:column;align-items:center;gap:20px;margin:auto}
.ovt{color:#e8e6df;font-size:18px;font-weight:600}
#cards{display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.ovbar{display:flex;gap:8px}
.ovbar button{background:#1d2436;color:#e8e6df}
.cw{filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c) 55%,transparent));cursor:pointer;transition:transform .18s;animation:deal .45s cubic-bezier(.2,.8,.2,1) var(--d) both}
.cw:hover{transform:translateY(-10px) scale(1.04)}
@keyframes deal{from{opacity:0;transform:translateY(40px) rotate(-3deg)}}
@media(prefers-reduced-motion:reduce){.cw{animation:none}}
.card,.in{clip-path:polygon(var(--cut) 0,calc(100% - var(--cut)) 0,100% var(--cut),100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,var(--cut) 100%,0 calc(100% - var(--cut)),0 var(--cut))}
.card{--cut:16px;width:200px;height:300px;padding:3px;box-sizing:border-box;background:var(--c)}
.in{--cut:13px;height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--c) 26%,transparent),transparent 62%),repeating-linear-gradient(45deg,transparent 0 9px,color-mix(in srgb,var(--c) 9%,transparent) 9px 10px),#0b1220}
.in h3{margin:0;padding:12px 8px 0;text-align:center;font:400 24px/1.1 "Lilita One","Arial Black",system-ui,sans-serif;letter-spacing:.03em;color:var(--c);text-shadow:0 0 12px color-mix(in srgb,var(--c) 60%,transparent)}
.art{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.art svg{width:130px;height:130px}
.txt{background:rgba(3,6,12,.82);padding:10px 12px 14px;font-size:12.5px;line-height:1.4;color:#c9d1e3;text-align:center;border-top:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.txt p{margin:0 0 6px}.txt ul{margin:0;padding:0;list-style:none}.txt li{font-weight:600}
.pos{color:#8be04e}.neg{color:#ff5a4d}
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<div class="bar" id="bar">
  <button id="g0" tabindex="-1">1 · Pistol</button>
  <button id="g1" tabindex="-1">2 · Shotgun</button>
  <button id="g2" tabindex="-1">3 · SMG</button>
  <button id="bn" tabindex="-1">N · Đạn nảy</button>
  <button id="bt" tabindex="-1">B · Bot bắn</button>
  <button id="ex" tabindex="-1">E · Đạn nổ</button>
  <button id="gr" tabindex="-1">G · Lựu đạn</button>
  <button id="cd" tabindex="-1">C · Card</button>
</div>
<p class="hint">A/D di chuyển, W hoặc Space nhảy, chuột để ngắm, giữ chuột trái để bắn, chuột phải hoặc G để ném lựu đạn.</p>
<div id="ov" hidden><div class="ovbox"><div class="ovt">Chọn 1 card</div><div id="cards"></div><div class="ovbar"><button id="rr" tabindex="-1">Rút lại</button><button id="cl" tabindex="-1">Đóng (Esc)</button></div></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1280,H=720,R=Math.random;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// Map: sàn, tường, trần và các platform lơ lửng
// k: f = khung, b = block hồng, p = trụ nâu. Nửa trái được lật gương sang nửa phải
const HALF=[{x:24,y:560,w:96,h:130,k:'b'},{x:220,y:520,w:230,h:90,k:'b'},{x:60,y:380,w:300,h:56,k:'b'},{x:200,y:290,w:22,h:90,k:'p'},{x:320,y:610,w:22,h:30,k:'p'}];
const P=[{x:0,y:690,w:1280,h:30,k:'f'},{x:0,y:0,w:24,h:720,k:'f'},{x:1256,y:0,w:24,h:720,k:'f'},{x:0,y:0,w:1280,h:24,k:'f'},{x:300,y:640,w:680,h:50,k:'b'},
...HALF,...HALF.map(r=>({...r,x:1280-r.x-r.w})),
{x:500,y:300,w:280,h:44,k:'b'},{x:629,y:190,w:22,h:110,k:'p'},{x:560,y:480,w:160,h:30,k:'b'}];
// Vẽ sẵn map vào 1 canvas ẩn: nền teal, bóng đổ chéo, block hồng có nét cọ, trụ nâu
const MAP=document.createElement('canvas');MAP.width=W;MAP.height=H;
(function(){
  const g=MAP.getContext('2d');let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#14444b');bg.addColorStop(1,'#0a1b27');g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(4,14,22,.16)';
  for(const b of P)if(b.k==='b'){const sx=170,sy=210,x=b.x,y=b.y,w=b.w,h=b.h;
    g.beginPath();g.moveTo(x,y);g.lineTo(x+w,y);g.lineTo(x+w,y+h);g.lineTo(x+w-sx,y+h+sy);g.lineTo(x-sx,y+h+sy);g.lineTo(x-sx,y+sy);g.closePath();g.fill()}
  for(const b of P){
    if(b.k==='f'){g.fillStyle='#061018';g.fillRect(b.x,b.y,b.w,b.h);continue}
    if(b.k==='p'){g.fillStyle='#7a3f34';g.fillRect(b.x,b.y,b.w,b.h);g.fillStyle='rgba(0,0,0,.22)';g.fillRect(b.x+b.w*.62,b.y,b.w*.38,b.h);continue}
    const gr=g.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);gr.addColorStop(0,'#ff4f8b');gr.addColorStop(1,'#ff8a5b');
    g.fillStyle=gr;g.fillRect(b.x,b.y,b.w,b.h);
    g.save();g.beginPath();g.rect(b.x,b.y,b.w,b.h);g.clip();g.lineCap='round';
    for(let i=0;i<b.w*b.h/700;i++){
      g.strokeStyle=rnd()<.5?'rgba(255,200,180,.18)':'rgba(120,20,60,.16)';g.lineWidth=3+rnd()*9;
      const x=b.x+rnd()*b.w,y=b.y+rnd()*b.h,l=20+rnd()*50;g.beginPath();g.moveTo(x,y);g.lineTo(x+l,y-l*.3);g.stroke();
    }
    g.restore();g.fillStyle='rgba(255,230,210,.55)';g.fillRect(b.x,b.y,b.w,3);
  }
})();
// Súng định nghĩa bằng data: thêm súng mới chỉ là thêm 1 object
const GUNS=[
{n:'Pistol',rate:.28,spd:1000,dmg:12,cnt:1,spr:.02,len:30,th:9,col:'#9a9ab0',kick:9,push:60,br:5,bn:0},
{n:'Shotgun',rate:.75,spd:900,dmg:6,cnt:7,spr:.22,len:44,th:12,col:'#b8895c',kick:18,push:260,br:4,bn:0},
{n:'SMG',rate:.08,spd:1150,dmg:5,cnt:1,spr:.07,len:36,th:8,col:'#7aa6bd',kick:5,push:25,br:4,bn:0}];
let gi=0,bounce=false,expl=false,paused=false,rateMul=1,gcdT=1.2,botOn=true,shake=0,freeze=0,mx=640,my=300,down=false;
const keys={},bullets=[],nades=[],parts=[],rings=[],flashes=[],texts=[];
const mk=(x,y,c,gun)=>({x,y,c,vx:0,vy:0,r:22,sq:1,g:false,fl:0,kick:0,ph:0,gun,cd:0,aim:0,t:0,dir:0,
  L:Array.from({length:4},()=>({x,y,vx:0,vy:0,fx:x,fy:y}))});
const pl=mk(120,330,'#4da3ff',GUNS[0]),bt=mk(1160,330,'#ff9b3d',GUNS[0]),bodies=[pl,bt];

function hit(x,y,r,b){
  const px=clamp(x,b.x,b.x+b.w),py=clamp(y,b.y,b.y+b.h),dx=x-px,dy=y-py,d=Math.hypot(dx,dy);
  if(d>=r)return null;
  if(d>1e-6)return{nx:dx/d,ny:dy/d,pen:r-d};
  const l=x-b.x,rt=b.x+b.w-x,t=y-b.y,bm=b.y+b.h-y,m=Math.min(l,rt,t,bm);
  return m===l?{nx:-1,ny:0,pen:m+r}:m===rt?{nx:1,ny:0,pen:m+r}:m===t?{nx:0,ny:-1,pen:m+r}:{nx:0,ny:1,pen:m+r};
}
function burst(x,y,a,sp,n,v,c,o={}){
  for(let i=0;i<n;i++){const t=a+(R()-.5)*sp,s=v*(.3+R()*.7),l=.25+R()*.45;
    parts.push({x,y,vx:Math.cos(t)*s,vy:Math.sin(t)*s,l,m:l,z:(2+R()*3)*(o.zm||1),c,g:500,...o})}
}
function impact(x,y,nx,ny){
  const a=Math.atan2(ny,nx);
  burst(x,y,a,1.5,9,420,'#ffd27a',{light:1,g:300});
  burst(x,y,a,2,6,240,'#5a5880',{g:900});
  rings.push({x,y,m:28,l:.22,l0:.22,c:'#ffe9b0'});
  shake=Math.min(1,shake+.05);
}
function hurt(t,b){
  t.fl=.12;t.vx+=b.vx*.1;t.vy-=140;freeze=.04;shake=Math.min(1,shake+.2);
  burst(t.x,t.y,Math.atan2(b.vy,b.vx),1.2,14,460,t.c,{light:1});
  rings.push({x:b.x,y:b.y,m:40,l:.25,l0:.25,c:'#ffffff'});
  texts.push({x:t.x+(R()-.5)*30,y:t.y-t.r-10,v:'-'+b.dmg,l:.8});
}
function fire(b,a){
  const g=b.gun,dx=Math.cos(a),dy=Math.sin(a),mxp=b.x+dx*(b.r+6+g.len),myp=b.y+dy*(b.r+6+g.len);
  b.cd=g.rate*(b===pl?rateMul:1);b.kick=g.kick;
  for(let i=0;i<g.cnt;i++){
    const s=a+(R()-.5)*2*g.spr,v=g.spd*(.92+R()*.16);
    bullets.push({x:mxp,y:myp,vx:Math.cos(s)*v,vy:Math.sin(s)*v,r:g.br+(expl?2:0),bn:g.bn+(bounce?2:0),dmg:g.dmg,o:b,t:[],col:b.c,ex:expl?{r:40+g.dmg*3.5,d:Math.round(g.dmg*1.5)}:0});
  }
  flashes.push({x:mxp,y:myp,a,l:.07,s:g.len*.9});
  burst(mxp,myp,a,.9,6,520,'#ffd57a',{light:1,g:200});
  parts.push({x:b.x+dx*(b.r+10),y:b.y+dy*(b.r+10),vx:-dx*60+(R()-.5)*120,vy:-220-R()*120,l:1.2,m:1.2,z:4,c:'#f1c24b',g:1400,sh:1});
  b.vx-=dx*g.push;b.vy-=dy*g.push*.3;
  shake=Math.min(1,shake+g.cnt*.04+g.kick*.01);
}
function phys(b,dt){
  b.vy+=1900*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  const was=b.g,vy0=b.vy;b.g=false;
  for(const p of P){
    const h=hit(b.x,b.y,b.r,p);if(!h)continue;
    b.x+=h.nx*h.pen;b.y+=h.ny*h.pen;
    const d=b.vx*h.nx+b.vy*h.ny;if(d<0){b.vx-=d*h.nx;b.vy-=d*h.ny}
    if(h.ny<-.5)b.g=true;
  }
  if(b.g&&!was&&vy0>350){
    b.sq=.7;burst(b.x,b.y+b.r,-Math.PI/2,2.8,8,170,'#9d9bbd',{g:250});
    if(vy0>700)shake=Math.min(1,shake+.12);
  }
  b.sq+=(1-b.sq)*Math.min(1,12*dt);b.fl=Math.max(0,b.fl-dt);b.cd-=dt;b.kick*=1-16*dt;
}
// Tay chân "noodle": điểm điều khiển của mỗi chi là 1 lò xo, nên bị trễ và rung khi di chuyển
function anim(b,dt){
  const dx=Math.cos(b.aim),dy=Math.sin(b.aim),f=dx<0?-1:1,run=Math.min(1,Math.abs(b.vx)/280),bot=b.y+b.r;
  b.ph+=Math.abs(b.vx)*dt*.06;
  const gx=b.x+dx*(b.r+6-b.kick*.6),gy=b.y+dy*(b.r+6-b.kick*.6),s=Math.sin(b.ph),c=Math.cos(b.ph),air=bot+12+clamp(b.vy*.012,-8,10);
  b.gp=[gx,gy];
  b.T=[[gx+dx*8,gy+dy*8],[gx+dx*22,gy+dy*22],
    b.g?[b.x-10+s*18*run,bot+4-Math.max(0,c)*10*run]:[b.x-9,air],
    b.g?[b.x+10-s*18*run,bot+4-Math.max(0,-c)*10*run]:[b.x+9,air]];
  b.L.forEach((l,i)=>{
    const [tx,ty]=b.T[i],fx=b.x+(i<2?0:i===2?-8:8),fy=i<2?b.y:b.y+8,mx2=(fx+tx)/2,my2=(fy+ty)/2,len=Math.hypot(tx-fx,ty-fy);
    const ix=i<2?mx2:mx2+f*len*.35,iy=i<2?my2+len*.3:my2;
    l.vx+=(ix-l.x)*260*dt;l.vy+=(iy-l.y)*260*dt;l.vx*=1-10*dt;l.vy*=1-10*dt;
    l.x+=l.vx*dt;l.y+=l.vy*dt;l.fx=fx;l.fy=fy;
  });
}
function move(b,tv,dt){b.vx+=(tv-b.vx)*Math.min(1,(b.g?16:5)*dt)}
function stepBullets(dt){
  for(const b of bullets){
    for(let s=0;s<2;s++){
      if(b.dead)break;b.x+=b.vx*dt/2;b.y+=b.vy*dt/2;
      for(const p of P){
        const h=hit(b.x,b.y,b.r,p);if(!h)continue;
        b.x+=h.nx*h.pen;b.y+=h.ny*h.pen;
        const d=b.vx*h.nx+b.vy*h.ny;if(d<0){b.vx-=2*d*h.nx;b.vy-=2*d*h.ny}
        if(b.ex){boom(b.x,b.y,b.ex.r,b.ex.d);b.dead=1;break}impact(b.x,b.y,h.nx,h.ny);if(b.bn--<=0)b.dead=1;break;
      }
      for(const t of bodies)if(t!==b.o&&!b.dead&&Math.hypot(t.x-b.x,t.y-b.y)<t.r+b.r){if(b.ex)boom(b.x,b.y,b.ex.r,b.ex.d);else hurt(t,b);b.dead=1}
    }
    b.t.push([b.x,b.y]);if(b.t.length>7)b.t.shift();
  }
  for(let i=bullets.length-1;i>=0;i--)if(bullets[i].dead)bullets.splice(i,1);
}
// Nổ: hiệu ứng lửa, khói, mảnh vỡ, rung màn hình, hit-stop và đẩy lùi theo khoảng cách
function boom(x,y,rad,dmg){
  freeze=Math.max(freeze,.05+rad/2400);shake=Math.min(1,shake+.25+rad/220);
  rings.push({x,y,m:rad*1.15,l:.3,l0:.3,c:'#ff9d3c',f:1},{x,y,m:rad*1.6,l:.4,l0:.4,c:'#fff3c4'});
  burst(x,y,0,6.3,16,rad*2.6,'#ff8a2b',{light:1,g:-60,zm:3.5});
  burst(x,y,0,6.3,26,rad*5,'#ffd27a',{light:1,g:600});
  burst(x,y,0,6.3,12,rad*2,'#4a4866',{g:-90,zm:3});
  burst(x,y,-Math.PI/2,2.6,10,rad*4,'#7a3f34',{g:1100});
  for(const t of bodies){
    const dx=t.x-x,dy=t.y-y,d=Math.hypot(dx,dy)||1,f=1-d/(rad+t.r);if(f<=0)continue;
    t.vx+=dx/d*f*1200;t.vy+=dy/d*f*1200-120;t.fl=.15;
    texts.push({x:t.x,y:t.y-t.r-10,v:'-'+Math.round(dmg*f),l:.9});
  }
}
// Lựu đạn: ném theo khoảng cách tới con trỏ, nảy trên platform, nổ sau 1.7s
function throwNade(b,tx,ty){
  if((b.gcd||0)>0)return;b.gcd=gcdT;
  const dx=tx-b.x,dy=ty-b.y,d=Math.hypot(dx,dy)||1,v=clamp(d*1.5,350,1000);
  nades.push({x:b.x+dx/d*(b.r+8),y:b.y+dy/d*(b.r+8),vx:dx/d*v+b.vx*.4,vy:dy/d*v-140+b.vy*.4,r:8,f:1.7,rot:0});
  b.kick=10;
}
function stepNades(dt){
  for(const b of bodies)b.gcd=Math.max(0,(b.gcd||0)-dt);
  if(botOn&&R()<dt*.12)throwNade(bt,pl.x,pl.y);
  for(const n of nades){
    n.vy+=1700*dt;n.x+=n.vx*dt;n.y+=n.vy*dt;n.f-=dt;n.rot+=n.vx*dt*.02;
    for(const p of P){
      const h=hit(n.x,n.y,n.r,p);if(!h)continue;
      n.x+=h.nx*h.pen;n.y+=h.ny*h.pen;const d=n.vx*h.nx+n.vy*h.ny;
      if(d<0){n.vx-=1.5*d*h.nx;n.vy-=1.5*d*h.ny;n.vx*=.93;if(h.ny<-.5&&d<-120)burst(n.x,n.y+n.r,-Math.PI/2,2,3,100,'#9d9bbd',{g:250})}
    }
    if(n.f<=0){n.dead=1;boom(n.x,n.y,135,45)}
  }
  for(let i=nades.length-1;i>=0;i--)if(nades[i].dead)nades.splice(i,1);
}
function step(dt){if(paused)return;
  if(freeze>0){freeze-=dt;return}
  const L=keys.KeyA||keys.ArrowLeft,Rt=keys.KeyD||keys.ArrowRight,J=keys.KeyW||keys.ArrowUp||keys.Space;
  pl.aim=Math.atan2(my-pl.y,mx-pl.x);
  move(pl,((Rt?1:0)-(L?1:0))*320,dt);
  if(J&&pl.g){pl.vy=-840;pl.sq=1.3;burst(pl.x,pl.y+pl.r,Math.PI/2,2.5,6,140,'#9d9bbd',{g:250})}
  if(down&&pl.cd<=0)fire(pl,pl.aim);
  // bot: đi lại ngẫu nhiên, nhảy, ngắm vào người chơi
  bt.aim=Math.atan2(pl.y-bt.y,pl.x-bt.x);bt.t-=dt;
  if(bt.t<=0){bt.t=1+R();bt.dir=[-1,0,1][R()*3|0];if(R()<.3&&bt.g)bt.vy=-760}
  move(bt,bt.dir*140,dt);
  if(botOn&&bt.cd<=0&&R()<dt*.7)fire(bt,bt.aim+(R()-.5)*.25);
  for(const b of bodies){phys(b,dt);anim(b,dt)}
  stepBullets(dt);stepNades(dt);
  for(const p of parts){p.vy+=p.g*dt;p.vx*=1-1.2*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.y>638&&p.vy>0){p.y=638;p.vy*=-.35;p.vx*=.6}p.l-=dt}
  for(const r of rings)r.l-=dt;
  for(const f of flashes)f.l-=dt;
  for(const t of texts){t.y-=60*dt;t.l-=dt}
  for(const a of [parts,rings,flashes,texts])for(let i=a.length-1;i>=0;i--)if(a[i].l<=0)a.splice(i,1);
  if(parts.length>500)parts.splice(0,parts.length-500);
  shake=Math.max(0,shake-1.8*dt);
}
function drawGun(b){
  const g=b.gun,[x,y]=b.gp,rc=(a,c,w,h)=>{ctx.fillRect(a,c,w,h);ctx.strokeRect(a,c,w,h)};
  ctx.save();ctx.translate(x,y);ctx.rotate(b.aim);if(Math.cos(b.aim)<0)ctx.scale(1,-1);
  ctx.fillStyle=g.col;ctx.strokeStyle='#0b0b12';ctx.lineWidth=2.5;ctx.lineJoin='round';
  rc(5,g.th/2-1,9,14);
  if(g.n==='SMG')rc(g.len*.5,g.th/2-1,8,17);
  rc(0,-g.th/2,g.len,g.th);
  if(g.n==='Shotgun')rc(g.len*.45,g.th/2-1,14,6);
  ctx.fillStyle='#2a2a36';rc(g.len-5,-g.th/2-2,5,g.th+4);
  ctx.restore();
}
function drawBody(b){
  const col=b.fl>0?'#fff':b.c;
  ctx.strokeStyle=col;ctx.lineWidth=6;ctx.lineCap='round';
  b.L.forEach((l,i)=>{ctx.beginPath();ctx.moveTo(l.fx,l.fy);ctx.quadraticCurveTo(l.x,l.y,b.T[i][0],b.T[i][1]);ctx.stroke()});
  const ry=b.r*b.sq,rx=b.r*(2-b.sq),cy=b.y+b.r-ry,f=Math.cos(b.aim)<0?-1:1;
  ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(b.x,cy,rx,ry,0,0,7);ctx.fill();
  for(const k of[-1,1]){
    const ex=b.x+f*4+k*8,ey=cy-ry*.2;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,6.5,0,7);ctx.fill();
    ctx.fillStyle='#14141c';ctx.beginPath();ctx.arc(ex+Math.cos(b.aim)*2.8,ey+Math.sin(b.aim)*2.8,3.2,0,7);ctx.fill();
  }
  drawGun(b);
  ctx.fillStyle=col;
  for(const i of[0,1]){ctx.beginPath();ctx.arc(b.T[i][0],b.T[i][1],4.5,0,7);ctx.fill()}
}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  const s=shake*shake*22;ctx.translate((R()-.5)*s,(R()-.5)*s);
  ctx.fillStyle='#061018';ctx.fillRect(-60,-60,W+120,H+120);ctx.drawImage(MAP,0,0);
  for(const b of bodies)drawBody(b);
  for(const n of nades){
    ctx.save();ctx.translate(n.x,n.y);ctx.rotate(n.rot);
    ctx.fillStyle='#4b5a3a';ctx.strokeStyle='#0b0b12';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,n.r,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#2b3322';ctx.fillRect(-3,-n.r-4,6,5);
    const on=n.f<.8?Math.sin(n.f*40)>0:Math.sin(n.f*10)>.6;
    ctx.fillStyle=on?'#ff4a3a':'#5a1a16';ctx.beginPath();ctx.arc(0,-1,2.6,0,7);ctx.fill();ctx.restore();
  }
  ctx.globalCompositeOperation='lighter';
  for(const b of bullets){
    ctx.strokeStyle=b.ex?'#ffa040':b.col;ctx.lineCap='round';
    for(let i=1;i<b.t.length;i++){
      ctx.globalAlpha=i/b.t.length;ctx.lineWidth=b.r*2*i/b.t.length;
      ctx.beginPath();ctx.moveTo(b.t[i-1][0],b.t[i-1][1]);ctx.lineTo(b.t[i][0],b.t[i][1]);ctx.stroke();
    }
    ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
  }
  for(const f of flashes){
    const a=f.l/.07;ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.a);ctx.globalAlpha=a;
    ctx.fillStyle='#ffd57a';ctx.beginPath();ctx.moveTo(-4,-f.s*.3*a-3);ctx.lineTo(f.s,0);ctx.lineTo(-4,f.s*.3*a+3);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,f.s*.22,0,7);ctx.fill();ctx.restore();
  }
  for(const r of rings){
    const a=r.l/r.l0;ctx.globalAlpha=a;ctx.strokeStyle=r.c;ctx.lineWidth=1+4*a;
    ctx.beginPath();ctx.arc(r.x,r.y,r.m*(1-a*a),0,7);if(r.f){ctx.fillStyle=r.c;ctx.globalAlpha=a*.35;ctx.fill();ctx.globalAlpha=a}ctx.stroke();
  }
  for(const p of parts){
    const a=p.l/p.m;ctx.globalAlpha=a;ctx.fillStyle=p.c;
    ctx.globalCompositeOperation=p.light?'lighter':'source-over';
    if(p.sh)ctx.fillRect(p.x,p.y,p.z,p.z*.5);
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.z*(.4+.6*a),0,7);ctx.fill()}
  }
  ctx.globalCompositeOperation='source-over';ctx.font='bold 20px system-ui,sans-serif';ctx.textAlign='center';
  for(const t of texts){ctx.globalAlpha=Math.min(1,t.l*2);ctx.fillStyle='#ffe27a';ctx.fillText(t.v,t.x,t.y)}
  ctx.globalAlpha=1;
}
// Input
const $=id=>document.getElementById(id);
function sync(){
  ['g0','g1','g2'].forEach((id,i)=>$(id).classList.toggle('on',i===gi));
  $('bn').classList.toggle('on',bounce);$('bt').classList.toggle('on',botOn);$('ex').classList.toggle('on',expl);
}
const setGun=i=>{gi=i;pl.gun=GUNS[i];sync()},togBn=()=>{bounce=!bounce;sync()},togBot=()=>{botOn=!botOn;sync()};
['g0','g1','g2'].forEach((id,i)=>$(id).onclick=()=>setGun(i));
$('bn').onclick=togBn;$('bt').onclick=togBot;
const togEx=()=>{expl=!expl;sync()};
$('ex').onclick=togEx;$('gr').onclick=()=>throwNade(pl,mx,my);
// Upgrade cards: viền vát góc, nền hoa văn theo màu, nhân vật nhắm mắt, mô tả + stat xanh/đỏ
const CARDS=[
{n:'BLAST',c:'#ff8a2b',d:'Bullets explode on impact and hurt everything nearby.',s:[['+','Area damage'],['-','Blast pushes you too']],f:()=>{expl=true},
 a:c=>`<polygon points="60,6 70,36 98,22 84,50 114,60 84,70 98,98 70,84 60,114 50,84 22,98 36,70 6,60 36,50 22,22 50,36" fill="${c}" opacity=".35"/>`},
{n:'BOUNCE',c:'#35d8ff',d:'Bullets ricochet off walls.',s:[['+','+2 Bounces']],f:()=>{bounce=true},
 a:c=>`<path d="M10 104 28 36 52 100 76 36 100 104" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".45"/>`},
{n:'FRAG',c:'#8be04e',d:'Grenades recharge much faster.',s:[['+','Grenade cooldown 0.5s']],f:()=>{gcdT=.5},
 a:c=>`<circle cx="94" cy="36" r="15" fill="${c}" opacity=".5"/><rect x="89" y="16" width="10" height="9" fill="${c}" opacity=".5"/>`},
{n:'RAPID',c:'#ffd400',d:'Shoot a lot faster.',s:[['+','Fire rate x1.7']],f:()=>{rateMul=.6},
 a:c=>`<path d="M14 30h40M6 52h30M14 74h40" stroke="${c}" stroke-width="6" stroke-linecap="round" opacity=".5"/>`},
{n:'BUCKSHOT',c:'#c78bff',d:'Fire a spread of pellets.',s:[['+','+6 Bullets'],['-','Slower fire rate']],f:()=>setGun(1),
 a:c=>`<g fill="${c}" opacity=".5"><circle cx="100" cy="34" r="5"/><circle cx="108" cy="52" r="5"/><circle cx="100" cy="70" r="5"/><circle cx="86" cy="44" r="4"/><circle cx="86" cy="62" r="4"/></g>`}];
let hand=[];
function cardHTML(k,i){
  const face='fill="none" stroke="#0d1424" stroke-width="3.5" stroke-linecap="round"';
  const art=`<svg viewBox="0 0 120 120">${k.a(k.c)}<circle cx="60" cy="64" r="34" fill="${k.c}"/><path d="M43 60q6 6 12 0M65 60q6 6 12 0" ${face}/><path d="M53 78q7-6 14 0" ${face}/></svg>`;
  return `<div class="cw" data-i="${i}" style="--c:${k.c};--d:${i*70}ms"><div class="card"><div class="in"><h3>${k.n}</h3><div class="art">${art}</div><div class="txt"><p>${k.d}</p><ul>${k.s.map(s=>`<li class="${s[0]==='+'?'pos':'neg'}">${s[1]}</li>`).join('')}</ul></div></div></div></div>`;
}
function deal(){hand=[...CARDS].sort(()=>R()-.5).slice(0,3);$('cards').innerHTML=hand.map(cardHTML).join('')}
function openCards(){paused=true;down=false;for(const k in keys)keys[k]=0;deal();$('ov').hidden=false}
function closeCards(){paused=false;$('ov').hidden=true}
const toggleCards=()=>$('ov').hidden?openCards():closeCards();
$('cd').onclick=toggleCards;$('rr').onclick=deal;$('cl').onclick=closeCards;
$('ov').onclick=e=>{if(e.target.id==='ov')closeCards()};
$('ov').addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
$('cards').onclick=e=>{const w=e.target.closest('.cw');if(!w)return;hand[+w.dataset.i].f();sync();closeCards()};
$('bar').addEventListener('mousedown',e=>e.preventDefault());
addEventListener('keydown',e=>{
  keys[e.code]=1;
  if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault();
  const n={Digit1:0,Digit2:1,Digit3:2}[e.code];if(n!==undefined)setGun(n);
  if(e.code==='KeyB')togBot();if(e.code==='KeyN')togBn();if(e.code==='KeyE')togEx();if(e.code==='KeyC')toggleCards();if(e.code==='Escape')closeCards();
  if(e.code==='KeyG'&&!e.repeat&&!paused)throwNade(pl,mx,my);
});
addEventListener('keyup',e=>{keys[e.code]=0});
function aim(e){const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)*W/r.width;my=(e.clientY-r.top)*H/r.height}
cv.addEventListener('pointermove',aim);
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);aim(e);if(e.button===2)throwNade(pl,mx,my);else down=true});
cv.addEventListener('pointerup',()=>{down=false});
cv.addEventListener('pointercancel',()=>{down=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{down=false;for(const k in keys)keys[k]=0});
sync();bodies.forEach(b=>anim(b,1/60));
let last=performance.now(),acc=0;
function loop(t){
  acc+=Math.min(.05,(t-last)/1000);last=t;
  while(acc>=1/60){step(1/60);acc-=1/60}
  render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
